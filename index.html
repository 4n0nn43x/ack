<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ack</title>
    <style>
      :root {
        --bg: #161616; --surface: #222222; --raised: #2c2c2c; --line: #343434;
        --text: #ededed; --muted: #9b9b9b; --faint: #6c6c6c;
        --lens: #5dff8f; --lens-dim: #2f8a4c; --danger: #ff7a6e; --ok: #7ee2a0;
        --radius: 14px;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
        touch-action: manipulation; -webkit-text-size-adjust: 100%; overscroll-behavior: none;
      }
      #app { max-width: 560px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 40px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
      .brand { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
      .tag { color: var(--muted); margin: 0 0 20px; }
      .pill { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--raised); color: var(--muted); white-space: nowrap; }
      .pill.live { color: var(--ok); }
      .pill.warn { color: var(--danger); }
      section { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
      h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 12px; }
      p { margin: 0 0 12px; }
      .hint { color: var(--muted); font-size: 13px; }
      label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 6px; }
      input, textarea, select {
        width: 100%; font: inherit; color: var(--text); background: var(--bg);
        border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; outline: none;
      }
      input:focus, textarea:focus, select:focus { border-color: #5a5a5a; }
      textarea { min-height: 88px; resize: vertical; }
      button {
        font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px 14px;
        background: var(--text); color: #111; width: 100%; margin-top: 12px; cursor: pointer;
      }
      button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
      button.link { background: none; color: var(--muted); width: auto; padding: 8px 0; margin: 0; font-weight: 500; }
      button.danger { background: transparent; color: var(--danger); border: 1px solid #4a2c29; }
      button:disabled { opacity: 0.5; }
      button.done { background: var(--ok); }
      select {
        appearance: none; -webkit-appearance: none; background-color: var(--bg); color: var(--text);
        background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
        background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px;
      }
      option { background: var(--surface); color: var(--text); }
      details.pick { border-top: 1px solid var(--line); }
      details.pick:first-of-type { border-top: 0; }
      details.pick summary { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; cursor: pointer; list-style: none; font-size: 15px; }
      details.pick summary::-webkit-details-marker { display: none; }
      details.pick summary::after { content: "›"; color: var(--muted); margin-left: 10px; transition: transform .15s; }
      details.pick[open] summary::after { transform: rotate(90deg); }
      details.pick .count { margin-left: auto; color: var(--muted); font-size: 13px; }
      details.pick[open] { padding-bottom: 8px; }
      .row { display: flex; gap: 10px; }
      .row > * { flex: 1; }
      .lens {
        position: relative; aspect-ratio: 2 / 1; background: #000; border-radius: 10px; overflow: hidden;
        container-type: inline-size; color: var(--lens);
        font: 3.85cqw/4.69cqw -apple-system, system-ui, sans-serif;
      }
      .lens .box { position: absolute; white-space: pre-wrap; word-break: break-word; overflow: hidden; padding: 0 0.6cqw; }
      .lens .b0 { color: #0f3a1d; } .lens .b1 { color: #1d6a37; } .lens .b2 { color: #2f9a52; } .lens .b3 { color: #48d071; } .lens .b4 { color: var(--lens); }
      .lens .row { height: 6.94cqw; line-height: 6.94cqw; padding: 0 2.1cqw; color: #2f9a52; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .lens .row.sel { color: var(--lens); outline: 1px solid var(--lens); outline-offset: -2px; border-radius: 1.4cqw; }
      ol { list-style: none; padding: 0; margin: 0; }
      ol li { padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
      ol li:first-child { border-top: 0; padding-top: 0; }
      .who { font-weight: 600; }
      .what { color: var(--muted); font-size: 13px; }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .stat { background: var(--raised); border-radius: 10px; padding: 10px; }
      .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
      .stat span { color: var(--muted); font-size: 12px; }
      .check { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; margin: 0; color: var(--text); }
      .check:first-of-type { border-top: 0; }
      .check input { width: 20px; height: 20px; accent-color: var(--lens); }
      .empty { color: var(--faint); font-size: 14px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
