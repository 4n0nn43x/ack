<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ack</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* Even Hub companion app design language (Even Realities "Software Design Guidelines", APP page):
         light tokens, 8-step type scale, 12 px screen margin, 16 px card inset, 6 px radius, 0/6/12/24 spacing.
         The official face is FK Grotesk Neue; it is not bundled, so the system grotesk stands in for it. */
      :root {
        --tc-1: #232323; --tc-2: #7B7B7B; --tc-hi: #FFFFFF; --tc-red: #FF453A; --tc-green: #4BB956;
        --bc-hi: #232323; --bc-1: #FFFFFF; --bc-2: #F6F6F6; --bc-3: #EEEEEE; --bc-4: #E4E4E4; --bc-accent: #FEF991;
        --sc-1: rgba(0, 0, 0, .5); --sc-2: rgba(35, 35, 35, .08);
        --radius: 6px; --margin: 12px; --inset: 16px;
        --lens: #5dff8f;
        font-family: "FK Grotesk Neue", -apple-system, "SF Pro Text", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; min-height: 100%; background: var(--bc-3); color: var(--tc-1);
        font-size: 15px; font-weight: 300; letter-spacing: -0.15px; line-height: 1.35;
        touch-action: manipulation; -webkit-text-size-adjust: 100%; overscroll-behavior: none;
      }
      #app { max-width: 560px; margin: 0 auto; padding: env(safe-area-inset-top) var(--margin) calc(96px + env(safe-area-inset-bottom)); }
      button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
      button { cursor: pointer; }
      [hidden] { display: none !important; }

      /* Header bar: 60 px, space-between. */
      .bar { position: sticky; top: 0; z-index: 5; height: 60px; display: flex; align-items: center; gap: 8px; background: var(--bc-3); }
      .bar h1 { flex: 1; margin: 0; font-size: 20px; font-weight: 400; letter-spacing: -0.6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .icon-btn { display: grid; place-items: center; width: 36px; height: 36px; margin-left: -6px; border: 0; background: none; padding: 0; }
      .chip { font-size: 13px; font-weight: 400; letter-spacing: -0.13px; color: var(--tc-2); white-space: nowrap; }
      .chip.live { color: var(--tc-green); }
      .chip.warn { color: var(--tc-red); }

      .ic { display: inline-grid; width: 24px; height: 24px; flex: none; }
      .ic svg { width: 100%; height: 100%; }
      .ic.big { width: 96px; height: 96px; color: var(--bc-4); }
      .ic.tiny { width: 16px; height: 16px; margin-left: 4px; vertical-align: -2px; color: var(--tc-2); }

      /* Cards and lists. */
      .card { background: var(--bc-1); border-radius: var(--radius); padding: var(--inset); margin-bottom: 12px; }
      .card.list { padding: 0 var(--inset); }
      .card.form { display: grid; gap: 12px; }
      .section { margin: 24px 0 6px; font-size: 13px; font-weight: 400; letter-spacing: -0.13px; color: var(--tc-2); }
      .row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 0; width: 100%; text-align: left; border: 0; background: none; }
      .row + .row { border-top: 1px solid var(--bc-3); }
      .row .main { flex: 1; min-width: 0; display: grid; gap: 2px; }
      .name { font-size: 15px; font-weight: 400; letter-spacing: -0.15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .prev { font-size: 13px; font-weight: 400; letter-spacing: -0.13px; color: var(--tc-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .side { display: grid; justify-items: end; gap: 4px; flex: none; }
      .time { font-size: 11px; font-weight: 400; letter-spacing: -0.11px; color: var(--tc-2); }
      .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--bc-hi); color: var(--tc-hi); font-size: 11px; font-weight: 400; display: grid; place-items: center; }
      .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--bc-4); flex: none; display: grid; place-items: center; overflow: hidden; font-size: 13px; font-weight: 400; color: var(--tc-1); }
      .avatar img { width: 100%; height: 100%; object-fit: cover; }
      .empty { margin: 0; padding: 16px 0; color: var(--tc-2); font-size: 13px; font-weight: 400; }
      #stats > .empty { padding: 0; }
      .hint { margin: 0; color: var(--tc-2); font-size: 13px; font-weight: 400; letter-spacing: -0.13px; }
      .hint.pad { margin: -4px 4px 0; }
      .label { margin: 0; font-size: 15px; font-weight: 400; }

      /* Buttons: standard white bar with the Go arrow, dark highlighted variant, red warning variant. */
      .btn { width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: var(--radius); background: var(--bc-1); color: var(--tc-1); font-size: 15px; font-weight: 400; margin-bottom: 12px; padding: 0 var(--inset); }
      .btn.dark { background: var(--bc-hi); color: var(--tc-hi); margin-bottom: 0; }
      .card .btn.dark + .btn { margin-top: 0; }
      .btn.warn { color: var(--tc-red); }
      .btn:disabled { opacity: .45; }
      .view > .btn.dark { margin-bottom: 12px; }

      /* Fields: 8% shaded fill, no border. */
      input, textarea, select { width: 100%; border: 0; border-radius: var(--radius); background: var(--sc-2); padding: 14px; font-size: 15px; font-weight: 400; outline: none; }
      input::placeholder, textarea::placeholder { color: var(--tc-2); }
      textarea { resize: vertical; min-height: 96px; }
      select { appearance: none; -webkit-appearance: none; }
      .pair { display: grid; grid-template-columns: 1fr 1.4fr; gap: 6px; }

      /* Sign in. */
      .hero { padding: 12px 4px 24px; }
      .hero h2 { margin: 0 0 6px; font-size: 24px; font-weight: 400; letter-spacing: -0.72px; line-height: 1.15; }
      .hero p { margin: 0; color: var(--tc-2); font-size: 15px; }
      .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 3px; border-radius: var(--radius); background: var(--bc-4); }
      .seg button { border: 0; border-radius: 4px; background: none; padding: 10px; font-size: 15px; font-weight: 400; color: var(--tc-2); }
      .seg button.on { background: var(--bc-1); color: var(--tc-1); }
      .qr { display: grid; place-items: center; padding: 12px; border-radius: var(--radius); background: var(--bc-2); }
      .qr > svg { width: min(240px, 70vw); height: auto; image-rendering: pixelated; }
      .qr.empty { min-height: 160px; }
      .steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 15px; }

      /* Lens: the real display, green on black, every container to scale. */
      .lens-card { padding: 12px; }
      .lens { position: relative; aspect-ratio: 2 / 1; background: #000; border-radius: 4px; overflow: hidden; container-type: inline-size; color: var(--lens); cursor: pointer; }
      /* Sized on the boxes, not on .lens: cqw on the container itself would follow the window, not the lens. */
      .lens .box { font: 400 3.85cqw/4.69cqw -apple-system, system-ui, sans-serif; letter-spacing: 0; position: absolute; white-space: pre-wrap; word-break: break-word; overflow: hidden; padding: 0 0.6cqw; }
      .lens .b0 { color: #0f3a1d; } .lens .b1 { color: #1d6a37; } .lens .b2 { color: #2f9a52; } .lens .b3 { color: #48d071; } .lens .b4 { color: var(--lens); }
      .lrow { display: block; width: 100%; height: 6.94cqw; line-height: 6.94cqw; padding: 0 2.1cqw; border: 0; background: none; color: #2f9a52; font: inherit; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .lrow.sel { color: var(--lens); outline: 1px solid var(--lens); outline-offset: -2px; border-radius: 1.4cqw; }
      .remote { display: grid; grid-template-columns: 44px 44px 1fr 1.35fr 44px; gap: 6px; margin-top: 12px; }
      .remote button { white-space: nowrap; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: var(--radius); background: var(--bc-2); font-size: 13px; font-weight: 400; }
      .remote button:active { background: var(--bc-4); }
      .menu { display: grid; gap: 6px; margin-top: 6px; }
      .menu button { min-height: 44px; border: 0; border-radius: var(--radius); background: var(--bc-accent); font-size: 15px; font-weight: 400; text-align: left; padding: 0 14px; }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .stats div { background: var(--bc-2); border-radius: var(--radius); padding: 12px; display: grid; gap: 2px; }
      .stats b { font-size: 20px; font-weight: 400; letter-spacing: -0.6px; font-variant-numeric: tabular-nums; }
      .stats span { font-size: 11px; font-weight: 400; color: var(--tc-2); }

      /* Chats. */
      .search { display: flex; align-items: center; gap: 8px; background: var(--sc-2); border-radius: var(--radius); padding: 0 12px; margin-bottom: 12px; color: var(--tc-2); }
      .search input { background: none; padding: 13px 0; }
      .tags { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; scrollbar-width: none; }
      .tags button { flex: none; border: 0; border-radius: 99px; background: var(--bc-1); padding: 8px 14px; font-size: 13px; font-weight: 400; color: var(--tc-2); }
      .tags button.on { background: var(--bc-hi); color: var(--tc-hi); }
      .follow { display: flex; align-items: center; gap: 12px; }
      .follow .main { flex: 1; min-width: 0; display: grid; gap: 2px; }
      .toggle { border: 0; background: none; padding: 0; display: grid; place-items: center; flex: none; }
      .tg { display: inline-grid; width: 36px; height: 24px; }
      .tg svg { width: 100%; height: 100%; }
      .msgs { display: grid; gap: 6px; padding-bottom: 12px; }
      .msg { max-width: 86%; padding: 10px 12px; border-radius: var(--radius); background: var(--bc-1); justify-self: start; }
      .msg.out { justify-self: end; background: var(--bc-hi); color: var(--tc-hi); }
      .msg .from { font-size: 13px; font-weight: 400; margin-bottom: 2px; }
      .msg .text { white-space: pre-wrap; word-break: break-word; font-size: 15px; }
      .msg .time { text-align: right; margin-top: 4px; }
      .msg.out .time { color: rgba(255, 255, 255, .6); }
      .kbd { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; margin-top: 10px; }
      .kb { min-height: 40px; border: 0; border-radius: var(--radius); background: var(--bc-2); padding: 8px 10px; font-size: 13px; font-weight: 400; letter-spacing: -0.13px; }
      .kb.success, .kb.primary { background: var(--bc-hi); color: var(--tc-hi); }
      .kb.danger { color: var(--tc-red); }
      .kb.armed { background: var(--tc-red); color: var(--tc-hi); }
      .kb.link, .kb.copy { text-decoration: underline; text-underline-offset: 3px; }
      .kb.off { opacity: .4; }
      .ad.adbar { margin-bottom: 12px; }
      .ad.adbar .kbd { margin-top: 8px; }
      /* A chat fills the screen, so the composer sits at the bottom even when there are few messages. */
      .v-chat { display: flex; flex-direction: column; min-height: calc(100dvh - 156px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
      .v-chat .composer { margin-top: auto; }
      .ad .tag { color: #2F7CF6; }
      .ad .info { margin-top: 6px; font-size: 13px; color: var(--tc-2); white-space: pre-wrap; }
      .composer { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom)); display: flex; gap: 6px; padding: 6px; border-radius: var(--radius); background: var(--bc-1); box-shadow: 0 0 0 12px var(--bc-3); }
      .composer input { flex: 1; }
      .send { width: 48px; border: 0; border-radius: var(--radius); background: var(--bc-hi); color: var(--tc-hi); display: grid; place-items: center; }

      /* Tab bar and toasts. */
      .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bc-1); padding: 8px max(var(--margin), calc((100vw - 560px) / 2)) calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid var(--bc-4); }
      .tabs button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 4px; color: var(--tc-2); font-size: 11px; font-weight: 400; }
      .tabs button.on { color: var(--tc-1); }
      .toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 7; max-width: calc(100vw - 24px); padding: 12px 16px; border-radius: var(--radius); background: var(--bc-hi); color: var(--tc-hi); font-size: 13px; font-weight: 400; white-space: pre-wrap; }
      .toast.warn { background: var(--bc-accent); color: var(--tc-1); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
